<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{report_title}}</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 40px;
            font-size: 10px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ddd;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        header img {
            height: 60px; /* Altura fija para los logos */
        }
        .header-center {
            text-align: center;
        }
        .header-center h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .header-center p {
            margin: 0;
            font-size: 1rem;
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 40px;
            right: 40px;
            text-align: center;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid #ddd;
            padding-top: 5px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 9px; /* Tamaño de fuente más pequeño para que quepa más */
        }
        th, td {
            border: 1px solid #ccc;
            padding: 4px;
            text-align: center;
            white-space: nowrap;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        .student-name-cell {
            text-align: left !important;
            font-weight: bold;
            background-color: #f9f9f9;
        }

        /* Estilos copiados de styles.css para consistencia */
        .month-header { font-weight: bold; font-size: 0.9em; text-transform: uppercase; }
        .month-bg-1 { background-color: #e0e7ff !important; }
        .month-bg-2 { background-color: #dcfce7 !important; }
        .partial-header { background-color: #1e293b !important; color: #f8fafc; font-size: 0.8em; }
        .date-header { font-size: 0.85em; }
        .status-presente { color: #22c55e; }
        .status-ausente { color: #ef4444; }
        .status-retardo { color: #f97316; }
        .status-intercambio { color: #6366f1; }
        .status-justificada { color: #06b6d4; }
        .status-pendiente { color: #9ca3af; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="{{logo_left}}" alt="Logo Izquierdo">
        </div>
        <div class="header-center">
            <h1>Reporte de Asistencia</h1>
            <p>{{group_name}}</p>
            <p>{{report_date}}</p>
        </div>
        <div class="header-right">
            <img src="{{logo_right}}" alt="Logo Derecho">
        </div>
    </header>

    <main>
        {{attendance_table}}
    </main>

    <footer>
        Generado por Asistencias IAEV
    </footer>
</body>
</html>
